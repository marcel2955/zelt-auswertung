<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeltfinder V2.1</title><style>body{font-family:Segoe UI,Arial,sans-serif;max-width:1200px;margin:auto;padding:20px;background:#eef2ef}h1,h2,h3{color:#1f6f43}.card{background:#fff;padding:16px;border-radius:10px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.1)}label{display:block;margin-top:10px;font-weight:600}input,select,button{width:100%;padding:8px;margin-top:4px}button{background:#1f6f43;color:#fff;border:none;border-radius:6px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px}.green{color:green}.amber{color:#b7791f}.red{color:#c53030}</style></head><body><h1>🏕️ Familien-Zeltfinder V2.1</h1><div class="card"><div class="grid"><div><label>Name</label><input id="name"></div><div><label>Alter (optional)</label><input id="alter" type="number"></div></div><label>Priorität</label><select id="prio"><option>Gewicht</option><option>Ausgewogen</option><option>Komfort</option></select><label>2×65cm Matten?</label><select id="matten"><option>KO-Kriterium</option><option>Mit Gepäck</option><option>Nicht wichtig</option></select><label>Innenbreite</label><select id="breite"><option>130 cm</option><option>140 cm</option><option>150 cm+</option></select><label>Einsatz</label><select id="einsatz"><option>Bikepacking</option><option>Wandern</option><option>Beides</option></select><label>Freistehend?</label><select id="frei"><option>Ja</option><option>Egal</option><option>Nein</option></select><label>Favorit</label><select id="favorit"><option>Anjan 3</option><option>Copper Spur HV UL3</option><option>Hubba Hubba 3</option><option>Nemo Dragonfly</option><option>X-Mid 2</option><option>Anaris</option></select><label>Anjan Score</label><select id="score"><option>10</option><option>9</option><option>8</option><option>7</option><option>6</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><button onclick="addPerson()">Teilnehmer speichern</button><button onclick="resetAll()">Alles löschen</button></div><div id="report" class="card"></div><script>let data=JSON.parse(localStorage.getItem('zeltV21')||'[]');function save(){localStorage.setItem('zeltV21',JSON.stringify(data));render();}function addPerson(){if(data.length>=5)return alert('Max. 5 Teilnehmer');let n=name.value.trim();if(!n)return alert('Name eingeben');data.push({name:n,alter:alter.value,prio:prio.value,matten:matten.value,breite:breite.value,einsatz:einsatz.value,frei:frei.value,favorit:favorit.value,score:+score.value});save();name.value='';alter.value='';}function resetAll(){if(confirm('Alle Daten löschen?')){data=[];save();}}function consensus(field){let vals=[...new Set(data.map(x=>x[field]))];if(vals.length===1)return ['🟢',vals[0]];if(vals.length===2)return ['🟡',vals.join(', ')];return ['🔴',vals.join(', ')];}function render(){if(!data.length){report.innerHTML='<h2>Noch keine Bewertungen</h2>';return;}let h='<h2>Familienauswertung</h2><p><b>Teilnehmer:</b> '+data.length+'/5</p>';h+='<table><tr><th>Name</th><th>Favorit</th><th>Anjan</th></tr>';data.forEach(d=>h+=`<tr><td>${d.name}</td><td>${d.favorit}</td><td>${d.score}</td></tr>`);h+='</table>';let avg=(data.reduce((a,b)=>a+b.score,0)/data.length).toFixed(1);h+='<h3>⭐ Durchschnitt Anjan-Score: '+avg+'/10</h3>';h+='<h3>Ampel-Auswertung</h3>';['prio','matten','breite','einsatz','frei'].forEach(f=>{let c=consensus(f);h+=`<p>${c[0]} <b>${f}</b>: ${c[1]}</p>`});let votes={};data.forEach(d=>votes[d.favorit]=(votes[d.favorit]||0)+1);let rank=Object.entries(votes).sort((a,b)=>b[1]-a[1]);h+='<h3>🏆 Ranking</h3><ol>';rank.forEach(r=>h+=`<li>${r[0]} (${r[1]} Stimmen)</li>`);h+='</ol>';let winner=rank[0][0];h+='<h3>🎯 Kaufempfehlung</h3>';if(winner==='Anjan 3'&&avg>=8)h+='<p class="green">Hilleberg Anjan 3 passt aktuell am besten.</p>';else h+='<p class="amber">Anjan 3, Copper Spur HV UL3 und Hubba Hubba 3 genauer vergleichen.</p>';let txt=encodeURIComponent(JSON.stringify(data,null,2));h+=`<p><a download="zelt-auswertung.json" href="data:text/json;charset=utf-8,${txt}">JSON exportieren</a></p>`;report.innerHTML=h;}render();</script></body></html>
